url: https://github.com/Instant-KING/dsh-ai-library
name: Instant-KING/dsh-ai-library
category: tools
description:
  en: 'Local library panel for DSH: indexes files and artifacts into a searchable card tree with PDF/Office/image preview, plus paper search, web-page archiving, a plugin-market tab and synced resources from installed plugins (personas, meme packs, whale assets). 18 tools, 22 host routes.'
  zh: 'DSH 的本地资料馆：把本机文件与产物索引成可搜索的卡片树，支持 PDF/Office/图片预览，另带论文检索、网页收藏、插件市场标签页，并同步已装插件里的资源（人设、表情包图集、鲸鱼素材）。18 个工具、22 条宿主路由。'
